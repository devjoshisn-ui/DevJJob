name: Dev Radar Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Radar memory
        uses: actions/cache@v4
        with:
          path: output/dev_seen.json
          key: dev-radar-seen-${{ github.run_id }}
          restore-keys: |
            dev-radar-seen-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Dev Radar
        run: python dev_radar.py

      - name: Upload today's results
        uses: actions/upload-artifact@v4
        with:
          name: dev-radar-results-${{ github.run_number }}
          path: output/*.csv
          if-no-files-found: error

      - name: Save Radar memory
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output/dev_seen.json
          key: dev-radar-seen-${{ github.run_id }}
