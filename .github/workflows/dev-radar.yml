name: Dev Radar Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Dev Radar
        run: python dev_radar.py

      - name: Upload today's results
        uses: actions/upload-artifact@v4
        with:
          name: dev-radar-results
          path: output/*.csv
